<!doctype html>
<!--
  The single document the static build ships.

  SvelteKit's placeholders (for the head, the body and the asset root) are the only
  substitutions here, so this comment must never spell them out — the substitution
  replaces the first occurrence, and a copy inside a comment silently wins over the real
  one, producing a page that serves the comment and leaves the document empty. The asset
  placeholder is what lets one document serve two mount points: the app at the root, and
  the embedded build under the prefix a host mounts it at.

  With `ssr = false` the body is just the app shell and the page paints itself in the
  browser. Nothing here loads from another origin except author avatars (GitHub
  photos for noreply commit emails, fetched with no referrer and no credentials):
  an offline workbench that quietly fetched a font or an analytics bundle would be
  both slower and a leak of the fact that the app is open.
-->
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>refyard</title>
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <!-- Installable as an app shell; the data still comes from the service on loopback. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!--
      Paint the canvas before any app code runs: the stored preference decides, and the
      system's own appearance is the fallback — the same rule the workbench applies once
      booted, so the first frame already shows the theme the person chose.
    -->
    <style>
      html {
        background-color: #fafafa;
      }
      html.dark {
        background-color: #0a0a0a;
      }
    </style>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("mode-watcher-mode");
          const dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          /* no storage (denied, private mode) — the stylesheet default stands */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body class="h-full" data-sveltekit-preload-data="hover">
    <div class="h-full">%sveltekit.body%</div>
  </body>
</html>
