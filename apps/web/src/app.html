<!doctype html>
<!--
  The single document the static build ships.

  SvelteKit's two placeholders (for the head and the body) are the only substitutions here,
  so this comment must never spell them out — the substitution replaces the first
  occurrence, and a copy inside a comment silently wins over the real one, producing a page
  that serves the comment and leaves the document empty.

  With `ssr = false` the body is just the app shell and the page paints itself in the
  browser. Nothing here loads from another origin: an offline workbench that quietly fetched
  a font or an analytics bundle would be both slower and a leak of the fact that the app is
  open.
-->
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>refyard</title>
    <link rel="icon" href="data:," />
    %sveltekit.head%
  </head>
  <body class="h-full" data-sveltekit-preload-data="hover">
    <div class="h-full">%sveltekit.body%</div>
  </body>
</html>
