[package]
name = "refyard-pty"
version = "0.1.0"
description = "Headless pty sessions for the Refyard hosts: spawn a shell in an approved directory and shuttle bytes."
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[dependencies]
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
# Reading the passwd entry for the login shell: a GUI process on macOS often
# has no `$SHELL`, and the passwd entry is where a login shell actually lives.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
