[package]
name = "refyard-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Refyard host: process execution, local and SSH providers, registry, jobs."

[dependencies]
refyard-contract = { path = "../refyard-contract" }
refyard-core = { path = "../refyard-core" }
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
thiserror.workspace = true
tokio.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
