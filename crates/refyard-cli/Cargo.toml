[package]
name = "refyard-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Refyard native command line: the same application service the desktop window serves, without a window or an HTTP listener unless one is asked for."

[[bin]]
name = "refyard-native"
path = "src/main.rs"

[lib]
name = "refyard_cli"
path = "src/lib.rs"

[dependencies]
refyard-contract = { path = "../refyard-contract" }
refyard-host = { path = "../refyard-host" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
