[package]
name = "refyard-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The native HTTP boundary: the same closed API the desktop window serves over Tauri, spoken over loopback HTTP with pairing tickets and SSE."

[dependencies]
refyard-contract = { path = "../refyard-contract" }
refyard-host = { path = "../refyard-host" }
refyard-core = { path = "../refyard-core" }
axum = "0.8"
tokio = { workspace = true }
tokio-stream = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = "0.3"
serde_urlencoded = "0.7"
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
