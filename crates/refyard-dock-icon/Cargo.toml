# A per-user appearance-aware Dock icon for the macOS shells.
#
# On macOS 11–15 a bundle switches its Dock icon with the system appearance only when
# it carries an appearance-aware asset catalog, and a bare `.icns` cannot express
# appearances — so this crate does what such a catalog would do at run time: pick the
# icon for the current appearance, apply it to `NSApplication`, and re-apply it when
# the system appearance changes. On macOS 26 and newer the desktop bundles ship that
# catalog (the `AppIcon.icon` document), the system owns the icon, and this crate
# stands down (`install` early-returns). The shells share one implementation because
# the behaviour — and the two PNGs it reads — is a product fact, not a shell detail.
#
# The Cocoa dependencies are gated to macOS itself: the release gate's `cargo test`
# runs on Linux, where `objc2` refuses to compile by design, and the crate's non-macOS
# build is the documented no-op stub.
[package]
name = "refyard-dock-icon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"] }
