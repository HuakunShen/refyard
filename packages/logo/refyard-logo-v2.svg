<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Refyard logo</title>
  <desc id="desc">Refyard wordmark with layered repository pages and a branching ref graph.</desc>
  <g transform="translate(12 10) scale(0.92)">

  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183552"/>
      <stop offset="1" stop-color="#0A1B2D"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D7FFF"/>
      <stop offset="1" stop-color="#1E5EFF"/>
    </linearGradient>
  </defs>

  <!-- back page -->
  <path d="M32 72
           Q32 56 47 50
           L108 27
           Q118 23 118 35
           L118 57
           L72 74
           Q61 78 61 90
           L61 191
           Q61 202 51 207
           L43 211
           Q32 206 32 194 Z"
        fill="url(#navyGrad)"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linejoin="round"/>

  <!-- middle page: white outline creates the first visible page gap -->
  <path d="M57 82
           Q57 67 70 62
           L131 39
           Q141 35 141 47
           L141 70
           L96 87
           Q85 91 85 103
           L85 198
           Q85 209 75 214
           L67 218
           Q57 213 57 202 Z"
        fill="#112A45"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linejoin="round"/>

  <!-- front page: second white separator -->
  <path d="M84 96
           Q84 81 97 76
           L151 56
           Q162 52 162 64
           L162 110
           Q162 123 150 128
           L115 142
           Q104 147 104 159
           L104 198
           Q104 211 91 217
           L84 220
           Q76 216 76 205
           L76 109
           Q76 101 84 96 Z"
        fill="url(#navyGrad)"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linejoin="round"/>

  <!-- blue ref path -->
  <path d="M173 60
           C173 91 171 104 153 114
           C132 126 119 132 119 153"
        fill="none"
        stroke="url(#blueGrad)"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- branch to secondary ref -->
  <path d="M119 153 C128 171 146 184 174 198"
        fill="none"
        stroke="#14283D"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- ref nodes -->
  <circle cx="173" cy="56" r="22" fill="#FFFFFF" stroke="url(#blueGrad)" stroke-width="13"/>
  <circle cx="119" cy="153" r="19" fill="#FFFFFF" stroke="url(#blueGrad)" stroke-width="12"/>
  <circle cx="184" cy="202" r="17" fill="#FFFFFF" stroke="#14283D" stroke-width="11"/>

  </g>
  <text x="250" y="167"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="108" font-weight="760" letter-spacing="-5"
        fill="#10263D">Ref<tspan fill="#2C68FF">y</tspan>ard</text>
  <text x="254" y="218"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="540" letter-spacing="6"
        fill="#60748A">YOUR GIT WORKSPACE</text>
</svg>
