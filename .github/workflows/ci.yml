# The release gate, run on a machine nobody was sitting at.
#
# The first run of this workflow was 2026-09-15 (`ci` on `main`, run 34981570854): both
# platforms passed `pnpm check` and died on `bun: not found` in the next command, which
# is why bun is installed below. Runs and their outcomes are recorded in
# docs/evidence/release-matrix.md.
#
# What it does is exactly the command contract from AGENTS.md §5, in the same order a
# person would run it, on Linux and on macOS. Nothing here is a substitute for a
# measurement on real hardware; it exists so that a change that breaks a gate is
# visible without a human remembering to run it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to the version in package.json "packageManager".
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The dev scripts are TypeScript run by bun (`check:boundaries`, `check:contract`,
      # `test:portable`, `pack:smoke`, `bench:runtime`), and never the product. The first
      # run of this workflow failed with `sh: 1: bun: not found` on both platforms for
      # exactly that reason — `pnpm check` passed, and the step died on the next command.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm test:integration` includes `tests/native`, which drives the real
      # `refyard-native` release binary — it fails by design when that binary is absent,
      # naming the task that forgot to build it. Every run before this step existed was
      # red for exactly that reason, on every platform.
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build the native host the integration suite drives
        run: cargo build --release

      - name: Static gates
        run: |
          pnpm check
          pnpm check:boundaries
          pnpm check:contract

      # The embedding facade includes platform privacy behavior; pnpm's native suites do
      # not execute its Rust integration test, so Windows DACL assertions live here.
      - name: Native embedding facade contract
        run: cargo test -p refyard-host --test embed

      - name: Unit and integration suites
        run: |
          pnpm test:unit
          pnpm test:integration

      - name: Portability smoke
        run: pnpm test:portable

      - name: Packaging and release-evidence checks
        run: pnpm test:pack

      - name: Build
        run: pnpm build:release

      - name: Validate Cloudflare Worker deployment
        run: pnpm --dir apps/web exec wrangler deploy --dry-run

      # All three engines, because `pnpm test:e2e` runs all three: installing only
      # chromium made the second CI run fail the same 60 specs on both platforms —
      # firefox and webkit could not launch. An engine that is not installed is not a
      # skipped engine; it is sixty failures.
      - name: Install the browsers the e2e suite drives
        run: pnpm exec playwright install --with-deps

      - name: End-to-end
        run: pnpm test:e2e

      - name: Compatibility suite
        run: pnpm test:compat

      - name: Packaged install smoke
        run: pnpm pack:smoke

      - name: Benchmark smoke
        run: |
          # A small fixture: this step proves the script runs on a clean machine. The
          # committed report is the one measured on the release machine, so it is put
          # back afterwards rather than replaced with CI numbers.
          pnpm bench:runtime --commits 2000 --reads 10 --runs 1
          git checkout -- docs/evidence/performance.json

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
