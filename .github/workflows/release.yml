# The desktop release pipeline: one tag push, five runners, one published release.
#
# The tag namespace is `app-v*` because the npm line (`publish.yml`) owns `v*`: a desktop
# tag and an npm tag must never be mistaken for each other. `__VERSION__` in the tag and
# release names is substituted by tauri-action from `tauri.conf.json`.
#
# Order inside every build job is the same order `scripts/build-desktop.ts` enforces
# locally: the SPA is built into `apps/web/build-desktop` BEFORE the Rust host compiles,
# because Tauri embeds the frontend directory at compile time — a stale frontend would be
# shipped silently. tauri-action performs the cargo build + bundle + release steps that
# the script performs locally.
#
# Signing: TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) are the Tauri updater's minisign key.
# They are harmless until updater artifacts are enabled in `tauri.conf.json`; once they
# are (the automatic-update feature), tauri-action also emits `latest.json` into the
# release.
#
# macOS builds are signed with a Developer ID Application certificate and notarized.
# That is not optional here: the first macOS step fails when any of the APPLE_* secrets
# is empty, so a tag can never quietly publish an unsigned, un-notarized app. The last
# macOS step verifies the finished bundle (Team ID, Developer ID authority, Gatekeeper,
# stapled ticket) before the matrix is considered green.
name: release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The headless contract runs before any artifact exists: a red gate never produces a
  # release. It is the same subset of the root command contract that runs without a
  # display (the browser e2e line is `ci.yml`'s job on main).
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type and boundary checks
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: Rust tests
        run: cargo test --workspace

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            triple: aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
            triple: x86_64-apple-darwin
          - platform: ubuntu-22.04 # x86_64, older glibc for compatibility
            args: ""
            triple: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm # arm64; public-repo runners only
            args: ""
            triple: aarch64-unknown-linux-gnu
          - platform: windows-latest # x86_64
            args: ""
            triple: x86_64-pc-windows-msvc
          # Windows ARM64 is deliberately absent: Tauri's own release sample omits it and
          # the WebView2 ARM64 bootstrapper is the flaky part. To try it, add:
          #   - platform: windows-latest
          #     args: --target aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: ${{ contains(matrix.platform, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Cross targets are only used on the macOS runners.
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SPA into the desktop dist
        # The exact first half of `scripts/build-desktop.ts`, before any Rust code runs.
        run: pnpm --dir apps/web exec vite build
        env:
          REFYARD_BUILD_TARGET: desktop

      - name: Build the bundled `refyard` command
        # The sidecar `bundle.externalBin` embeds. It must be built for the same triple the
        # bundle is, and named `<name>-<triple>` for the bundler to find it.
        run: bun scripts/stage-launcher.ts ${{ matrix.triple }}

      - name: Require the Apple Developer ID configuration
        # Fail before the expensive build: Tauri only *warns* when notarization
        # credentials are missing, which would publish a bundle Gatekeeper rejects.
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_NOTARY_API_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID \
                      APPLE_NOTARY_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::required Apple signing secret $name is empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to build a macOS release without Developer ID signing and notarization credentials"
            exit 1
          fi

          # notarytool reads the key through APPLE_API_KEY_PATH; Tauri does not
          # write it for us, and its search paths are relative to $HOME.
          PRIVATE_KEYS="$RUNNER_TEMP/private_keys"
          mkdir -p "$PRIVATE_KEYS"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" \
            | base64 -D > "$PRIVATE_KEYS/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          chmod 600 "$PRIVATE_KEYS/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"

          # Prove the certificate and its password work now, not after a long
          # build. This keychain is only a probe; Tauri imports APPLE_CERTIFICATE
          # into its own temporary keychain when it signs.
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/preflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERTIFICATE"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERTIFICATE"
          }
          trap cleanup EXIT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -k "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -F "$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::the imported certificate does not contain $APPLE_SIGNING_IDENTITY"; exit 1; }

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_NOTARY_KEY_ID }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: app-v__VERSION__
          releaseName: Refyard v__VERSION__
          releaseBody: See the assets to install this version. The desktop app runs its own Git, needs no network for local repositories, and updates itself from this release feed.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the signed and notarized bundle
        # tauri-action has already attached the archives, so a failure here is
        # loud rather than silent: the job goes red and the release is not
        # considered shippable until the same checks pass.
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle"
          APP="$BUNDLE_DIR/macos/Refyard.app"
          DMG=""
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          fi

          [ -d "$APP" ] || { echo "::error::missing app bundle: $APP"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"

          DETAILS="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          printf '%s\n' "$DETAILS" | grep -Fqx "TeamIdentifier=$APPLE_TEAM_ID" \
            || { echo "::error::unexpected Team ID (expected $APPLE_TEAM_ID)"; printf '%s\n' "$DETAILS"; exit 1; }
          printf '%s\n' "$DETAILS" | grep -F "Authority=Developer ID Application" >/dev/null \
            || { echo "::error::not signed with a Developer ID Application certificate"; printf '%s\n' "$DETAILS"; exit 1; }
          printf '%s\n' "$DETAILS" | grep -F "Runtime Version=" >/dev/null \
            || { echo "::error::the hardened runtime is not enabled"; printf '%s\n' "$DETAILS"; exit 1; }

          spctl --assess --type execute --verbose=4 "$APP"
          if [ -n "$DMG" ]; then
            codesign --verify --strict --verbose=2 "$DMG"
          fi

          VALIDATED=false
          for ATTEMPT in 1 2 3; do
            if xcrun stapler validate "$APP"; then
              VALIDATED=true
              break
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "::warning::stapler validation failed; retrying ($ATTEMPT/3)"
              sleep 5
            fi
          done
          if [ "$VALIDATED" != true ]; then
            echo "::error::the notarization ticket is not stapled to $APP"
            exit 1
          fi

  # The VS Code extension rides the same release. No Rust here: the .vsix bundles the
  # shared web UI and the host that spawns the machine's own CLI. The build matrix
  # creates the release with its first artifact, so this job waits for it to exist
  # before attaching; on a manual dispatch there is no tag and nothing to attach to.
  vsix:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Version the extension from the tag
        # The tag carries the release's version, so the .vsix name and its extension
        # version always match the release they are attached to.
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          export VERSION
          node -e "const fs=require('fs');const p='apps/refyard-vscode/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Package the .vsix
        run: pnpm --dir apps/refyard-vscode package

      - name: Wait for the release to exist
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          for _ in $(seq 1 60); do
            if gh release view "app-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "the release did not appear within 30 minutes" >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the .vsix to the release
        run: |
          VERSION="${GITHUB_REF_NAME#app-v}"
          gh release upload "app-v$VERSION" "apps/refyard-vscode/refyard-$VERSION.vsix" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
