name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish refyard
    environment:
      name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun for repository scripts
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Static gates
        run: |
          pnpm check
          pnpm check:boundaries
          pnpm check:contract

      - name: Unit and integration suites
        run: |
          pnpm test:unit
          pnpm test:integration

      - name: Portability and package tests
        run: |
          pnpm test:portable
          pnpm test:pack

      - name: Build the publishable artifact
        run: pnpm build:release

      - name: Smoke-test the packed artifact
        run: pnpm pack:smoke

      - name: Verify the tag matches the package version
        shell: bash
        run: |
          version="$(node -p "require('./packages/npm-dist/package.json').version")"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Publish with npm Trusted Publishing
        working-directory: packages/npm-dist
        run: npm publish
