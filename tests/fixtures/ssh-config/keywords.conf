# Keyword matching ignores case, `Host=value` is a legal spelling, whitespace between
# patterns does not matter, and a `#` that ends a line starts a comment. Every pattern on
# a Host line below is concrete except the last line's wildcards, negation and `%` token.
HOST UpperCase
host=EqualForm
   hOsT   Tabbed	Too
Host mixed*Pattern ?mark !negated %h
